# ============================================================
# AlphaFlow 参数配置文件
# 所有策略参数集中管理，实盘/回测共用同一套配置
# ============================================================

strategy:
  # 均线周期参数
  fast_period: 10          # 快线周期 (EMA)
  slow_period: 25          # 慢线周期 (EMA)  [注: V3.0用的是30]
  trend_period: 200        # 趋势过滤均线周期 (SMA/EMA)

  # RSI 参数
  rsi_period: 14           # RSI 计算周期
  rsi_upper: 65            # RSI 上限（避免追高）

  # ADX 趋势强度参数
  adx_period: 14           # ADX 计算周期
  adx_threshold: 20        # ADX 阈值（低于此值不入场）

  # ATR 波动率参数
  atr_period: 14           # ATR 计算周期
  atr_multiplier: 2.5      # ATR 止损倍数

  # [P1-新增] 波动率状态过滤
  vol_filter_period: 100   # ATR 均值回看周期（100 个交易日）
  vol_filter_ratio: 0.8    # ATR / ATR均值 > 此比值才入场（过滤震荡市）

  # [P1-改进] ATR 动态移动止盈（替代固定 12%）
  trailing_atr_mult: 3.0   # 移动止盈距离 = 3.0 × ATR
  trailing_stop: 0.12      # 保留旧参数作为兜底上限

risk:
  risk_per_trade: 0.030    # 每笔交易风险敞口提升至 (3.0%)
  alloc_index: 0.60       # 指数类标的（VOO, QQQ）最大资金分配占比 60%
  alloc_stock: 0.40       # 个股类标的最大资金分配占比 40%
  index_multiplier: 3.0   # 指数类标的风险预算乘数

backtest:
  initial_cash: 50000.0    # 初始资金（量化路线：$50k 组合回测基准）
  commission: 0.001       # 交易佣金 (0.1%)
  start_date: "2010-01-01" # [P0] 延长至 2010，覆盖多个牛熊周期
  end_date: "2026-06-03"

live:
  tws_host: "127.0.0.1"
  tws_port: 7497
  client_id: 1          # V8 底仓管理（deprecated 动量入场）
  scan_interval_seconds: 3600

# 期权策略（scripts/live/ibkr_options.py，client_id=3）
options_trading:
  client_id: 3
  underlyings: ["QQQ", "VOO", "AAPL", "MSFT"]
  stock_core:
    QQQ: 100
    VOO: 0
    AAPL: 0
    MSFT: 0
  regime:
    benchmark: "QQQ"
    trend_period: 200
    require_bull_market: true
    adx_trend_threshold: 25
    adx_range_low: 15
    adx_range_high: 25
  chain:
    dte_min: 21
    dte_max: 45
    delta_target_cc: 0.25
    delta_target_csp: 0.25
    delta_target_spread: 0.30
    spread_width: 5
  risk:
    max_contracts_per_symbol: 2
    max_portfolio_margin_pct: 0.30
    max_loss_per_trade: 500
    profit_take_pct: 0.50
    roll_dte: 7
  execution:
    order_type: limit
    limit_offset_pct: 0.02
    loop_seconds: 300
    dry_run: true                    # V10 legacy 入口默认禁止下单
    connect_timeout: 10              # 连接超时（秒），避免 TWS 未开时长时间挂起
  strategies:
    covered_call: true
    cash_secured_put: true
    bull_put_spread: true
    bear_call_spread: false
  chain_data:
    provider: "polygon"              # polygon | csv | yfinance
    api_key_env: "POLYGON_API_KEY"   # 环境变量名（读取 .env）
    rate_limit_seconds: 1.0
    csv_path: ""                     # provider=csv 时填写路径
    fast_mode: true                  # 快速模式：合约来自 Polygon，权利金用 BS 估算
    max_price_lookups: 4             # 非 fast 时最多询价次数
    max_strikes_per_expiry: 12
    use_black_scholes_fallback: true
    default_iv: 0.22
    replay_stride_days: 10           # 快速回放每 10 个交易日评估一次开仓
  replay:
    start_date: "2023-01-01"
    end_date: "2026-06-03"
    initial_cash: 50000.0

# 指数日线策略标的（V8，使用 alloc_index 60% 资金池）
index_tickers:
  - "QQQ"
  - "VOO"

# 热门股短线策略（scripts/live/ibkr_hot_stocks.py，使用 alloc_stock 40% 资金池）
hot_trading:
  client_id: 2          # 与 V8 区分，避免 TWS 客户端 ID 冲突
  loop_seconds: 60
  exclude_symbols: ["VOO", "QQQ", "SPY", "IWM"]
  scanner:
    scan_code: "TOP_PERC_GAIN"      # 当日涨幅榜
    location_code: "STK.US.MAJOR"
    min_price: 10.0
    min_volume: 1000000
    max_results: 15
    rescan_minutes: 15
  position:
    max_hold_days: 5                 # 最长持仓 5 个日历日
    max_positions: 5
    max_single_position_pct: 0.10    # 单票不超过个股池 10%
  market_filter:
    benchmark: "QQQ"           # 大盘趋势过滤基准
    trend_period: 200          # 基准在 trend_period EMA 之上才开仓
    require_bull_market: true
  entry:
    fast_ema: 9
    slow_ema: 21
    rsi_period: 14
    rsi_max: 70
    require_above_vwap: true
    require_golden_cross: true # 事件型金叉（当根 K 线发生交叉）
    adx_period: 14
    min_adx: 20                # 趋势强度过滤
    rel_volume_period: 20
    min_rel_volume: 1.2        # 相对成交量 > 20 根均量 × 1.2
    require_bull_market: true
  exit:
    take_profit_pct: 0.05
    stop_loss_pct: 0.04
    use_ema_cross: true
    use_vwap_break: true
    force_exit_on_max_hold: true
  risk:
    stock_pool_pct: 0.40             # 与 risk.alloc_stock 对齐
    risk_per_trade: 0.02
    pool_drawdown_halt_pct: 0.05
  replay:
    start_date: "2023-01-01"         # 扫描器日线回放区间
    end_date: "2026-06-03"
    initial_cash: 20000.0            # 个股池 40% of 50k
    commission: 0.001
    grid_objective: balanced         # balanced | return | trades | profit_factor
    # 敏感性网格默认维度见 alphaflow/hot_grid.py（用法: python scripts/hot_grid_search.py）

# Walk-Forward 样本外验证（用法: python scripts/walk_forward.py）
walk_forward:
  mode: holdout              # holdout | rolling
  scope: single              # single | portfolio
  objective: sharpe          # sharpe | return | calmar
  top_k_train: 10            # 训练集 Top-K 候选进入验证集
  quick_grid: false          # true = 较小网格，更快；或命令行 --quick
  tickers:
    - "VOO"
    - "QQQ"
  holdout:
    train_start: "2010-01-01"
    train_end: "2020-12-31"
    val_start: "2021-01-01"
    val_end: "2023-12-31"
    test_start: "2024-01-01"
    test_end: "2026-06-03"
  rolling:
    train_years: 5
    test_years: 1
    step_years: 1
    data_start: "2010-01-01"
    data_end: "2026-06-03"

# 历史回测固定标的列表（热门股动态策略需模拟盘验证，无法用固定名单回测）
tickers:
  - "QQQ"
  - "VOO"
  - "NVDA"
  - "AMD"
  - "TSLA"
  - "COIN"
  - "PLTR"
  - "MSTR"
  - "SMCI"
  - "CRWD"
  - "UPST"
  - "CVNA"
  - "SHOP"
  - "XYZ"
  - "MARA"
  - "APP"
  - "NET"
