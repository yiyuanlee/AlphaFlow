name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install backtrader yfinance pandas numpy matplotlib pyyaml pytest

      - name: Check imports (backtest modules)
        run: |
          python -c "from backtest_main import AlphaFlowStrategy, fetch_data, run_portfolio_backtest; print('backtest_main imports OK')"
          python -c "from optimize import AlphaFlowStrategy, grid_search; print('optimize imports OK')"

      - name: Run unit tests (skip IBKR live tests)
        run: |
          pytest --ignore=test_ibkr.py -v || echo "No unit tests found"
