# Options strategy (V10 legacy compatibility profile)
options_trading:
  client_id: 3
  underlyings: ["QQQ", "VOO", "AAPL", "MSFT"]
  stock_core:
    QQQ: 100
    VOO: 0
    AAPL: 0
    MSFT: 0
  regime:
    benchmark: "QQQ"
    trend_period: 200
    require_bull_market: true
    adx_trend_threshold: 25
    adx_range_low: 15
    adx_range_high: 25
  chain:
    dte_min: 21
    dte_max: 45
    delta_target_cc: 0.25
    delta_target_csp: 0.25
    delta_target_spread: 0.30
    spread_width: 5
  risk:
    max_contracts_per_symbol: 2
    max_portfolio_margin_pct: 0.30
    max_loss_per_trade: 500
    profit_take_pct: 0.50
    roll_dte: 7
  execution:
    order_type: limit
    limit_offset_pct: 0.02
    loop_seconds: 300
    # Legacy V10 execution is disabled by default. Use paper_qqq_cc for V11.
    dry_run: true
    connect_timeout: 10
  strategies:
    covered_call: true
    cash_secured_put: true
    bull_put_spread: true
    bear_call_spread: false
  chain_data:
    provider: "polygon"
    api_key_env: "POLYGON_API_KEY"
    rate_limit_seconds: 1.0
    csv_path: ""
    fast_mode: true
    max_price_lookups: 4
    max_strikes_per_expiry: 12
    use_black_scholes_fallback: true
    default_iv: 0.22
    replay_stride_days: 10
  replay:
    start_date: "2023-01-01"
    end_date: "2026-06-03"
    initial_cash: 50000.0
